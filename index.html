<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub - Learning Platform</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2C3E50;
            --light: #F8F9FA;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(124deg, #ff2400, #e81d1d, #e8b71d, #e3e81d, #1de840, #1ddde8, #2b1de8, #dd00f3);
            background-size: 1800% 1800%;
            animation: rainbowShift 18s ease infinite;
            min-height: 100vh;
            color: var(--dark);
        }

        @keyframes rainbowShift {
            0% { background-position: 0% 82%; }
            50% { background-position: 100% 19%; }
            100% { background-position: 0% 82%; }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            animation: drift 20s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .unicorn {
            position: fixed;
            bottom: 20px;
            left: -200px;
            font-size: 8rem;
            z-index: 40;
            animation: unicornFloat 25s linear infinite;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.8));
        }

        @keyframes unicornFloat {
            0% { left: -200px; bottom: 20px; }
            50% { left: 50vw; bottom: 30vh; }
            100% { left: 110vw; bottom: 20px; }
        }

        #accountModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #accountModal.hidden {
            display: none;
        }

        .account-box {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .account-title {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary), #A86DD1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--light);
        }

        .tab-btn {
            padding: 0.8rem 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--secondary);
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(78,205,196,0.3);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), #A86DD1);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255,107,107,0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 4px solid var(--accent);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #A86DD1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 1.5rem;
            background: var(--light);
            border-radius: 25px;
            border: 2px solid var(--secondary);
        }

        .user-name {
            font-weight: 600;
        }

        .user-role {
            font-size: 0.8rem;
            padding: 0.3rem 0.8rem;
            background: var(--accent);
            border-radius: 12px;
            color: var(--dark);
            font-weight: 600;
        }

        nav {
            display: flex;
            gap: 1rem;
        }

        nav button {
            background: white;
            border: 2px solid var(--secondary);
            padding: 0.7rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            transition: all 0.3s;
        }

        nav button:hover, nav button.active {
            background: var(--secondary);
            color: white;
        }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .section h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--dark);
        }

        .assignment-card {
            background: linear-gradient(135deg, rgba(78,205,196,0.05), rgba(168,109,209,0.05));
            padding: 2rem;
            border-radius: 20px;
            border: 2px solid var(--secondary);
            margin-bottom: 1.5rem;
            transition: all 0.3s;
        }

        .assignment-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .assignment-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .assignment-due {
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .assignment-status {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .status-pending {
            background: rgba(255,230,109,0.3);
            color: #d4a500;
        }

        .status-submitted {
            background: rgba(78,205,196,0.3);
            color: #00a896;
        }

        .status-graded {
            background: rgba(255,107,107,0.3);
            color: #e74c3c;
        }

        .upload-area {
            border: 3px dashed var(--secondary);
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--light);
            margin: 1rem 0;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(255,107,107,0.05);
        }

        .input-group {
            display: grid;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .input-group input, .input-group textarea, .input-group select {
            padding: 1rem;
            border: 2px solid var(--secondary);
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
        }

        .input-group input:focus, .input-group textarea:focus, .input-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(78,205,196,0.3);
        }

        .btn-small {
            padding: 0.7rem 1.5rem;
            font-size: 0.9rem;
            width: auto;
        }

        .notification {
            position: fixed;
            top: 120px;
            right: 20px;
            background: white;
            padding: 1rem 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 900;
            animation: slideIn 0.3s ease, slideOut 0.3s ease 2.7s;
            border-left: 5px solid var(--secondary);
        }

        @keyframes slideIn {
            from { transform: translateX(400px); }
            to { transform: translateX(0); }
        }

        @keyframes slideOut {
            to { transform: translateX(400px); opacity: 0; }
        }

        @media (max-width: 768px) {
            nav { flex-wrap: wrap; }
            .header-content { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>
    <div class="unicorn">🦄</div>

    <!-- Account Modal -->
    <div id="accountModal">
        <div class="account-box">
            <div class="account-title">🎓 StudyHub</div>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- Login -->
            <div id="loginTab" class="tab-content active">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com">
                </div>
                <button class="btn" onclick="handleLogin()">Login</button>
                <p style="text-align: center; color: #999; font-size: 0.9rem; margin-top: 1rem;">
                    📱 Access from any device
                </p>
            </div>

            <!-- Signup -->
            <div id="signupTab" class="tab-content">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="signupName" placeholder="Your name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>I am a...</label>
                    <select id="accountType">
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                    </select>
                </div>
                <button class="btn" onclick="handleSignup()">Create Account</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="header-content">
            <div class="logo">🎓 StudyHub</div>
            <nav>
                <button data-section="home" class="active">Home</button>
                <button data-section="assignments">Assignments</button>
            </nav>
            <div class="user-section">
                <div class="user-info">
                    <span class="user-name" id="userName"></span>
                    <span class="user-role" id="userRole"></span>
                </div>
                <button class="btn btn-small" onclick="logout()">Logout</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <!-- Home -->
        <section id="home" class="section active">
            <div class="card">
                <h2>Welcome to StudyHub! 🌍</h2>
                <p style="font-size: 1.1rem; line-height: 1.8; color: #666;">
                    Your learning companion for assignments and collaboration. 
                    <br><strong>Your account syncs across all devices!</strong>
                </p>
            </div>
        </section>

        <!-- Assignments -->
        <section id="assignments" class="section">
            <div class="card">
                <h2 id="assignTitle">Assignments</h2>
                
                <!-- Teacher Section -->
                <div id="teacherSection" style="display:none;">
                    <h3 style="font-size: 1.3rem; margin: 2rem 0 1rem 0;">📝 Create Assignment</h3>
                    <div class="input-group">
                        <input type="text" id="assignmentTitle" placeholder="Title">
                        <textarea id="assignmentDesc" rows="4" placeholder="Description"></textarea>
                        <input type="date" id="assignmentDue">
                        <input type="number" id="assignmentPoints" placeholder="Points" value="100">
                        <button class="btn" onclick="createAssignment()">Post Assignment</button>
                    </div>

                    <h3 style="font-size: 1.3rem; margin: 2rem 0 1rem 0;">📊 Submissions</h3>
                    <div id="submissionsArea"></div>
                </div>

                <!-- Student Section -->
                <div id="studentSection" style="display:none;">
                    <div id="assignmentsArea"></div>
                </div>
            </div>
        </section>
    </div>

    <input type="file" id="fileInput" multiple style="display:none;">

    <script>
        // EMBEDDED DATABASE (Hard-coded initial data)
        const DATABASE = {
            users: {
                'demo@student.com': { name: 'Demo Student', role: 'student', email: 'demo@student.com', created: '2024-01-01' },
                'demo@teacher.com': { name: 'Demo Teacher', role: 'teacher', email: 'demo@teacher.com', created: '2024-01-01' },
                'saahir@studyhub.com': { name: 'Saahir', role: 'student', email: 'saahir@studyhub.com', created: '2024-01-01' },
                'john@studyhub.com': { name: 'John Teacher', role: 'teacher', email: 'john@studyhub.com', created: '2024-01-01' },
                'alice@studyhub.com': { name: 'Alice Student', role: 'student', email: 'alice@studyhub.com', created: '2024-01-01' },
                'emma@studyhub.com': { name: 'Emma Teacher', role: 'teacher', email: 'emma@studyhub.com', created: '2024-01-01' }
            },
            assignments: [
                { id: 1, title: 'Math Assignment 1', desc: 'Solve algebra problems', due: '2024-12-20', points: 100, teacher: 'john@studyhub.com', teacherName: 'John Teacher', created: '2024-01-01' },
                { id: 2, title: 'English Essay', desc: 'Write a 500 word essay', due: '2024-12-25', points: 50, teacher: 'emma@studyhub.com', teacherName: 'Emma Teacher', created: '2024-01-01' },
                { id: 3, title: 'Science Project', desc: 'Research and present findings', due: '2024-12-28', points: 75, teacher: 'john@studyhub.com', teacherName: 'John Teacher', created: '2024-01-02' }
            ],
            submissions: {
                1: [
                    { student: 'saahir@studyhub.com', studentName: 'Saahir', files: [{name: 'math_homework.pdf', size: 2048}], date: '2024-12-18', grade: null },
                    { student: 'alice@studyhub.com', studentName: 'Alice Student', files: [{name: 'solutions.docx', size: 3072}], date: '2024-12-19', grade: '92' }
                ],
                2: [
                    { student: 'alice@studyhub.com', studentName: 'Alice Student', files: [{name: 'essay.docx', size: 5120}], date: '2024-12-24', grade: '88' }
                ],
                3: []
            }
        };

        // Initialize database from embedded data
        let dbData = localStorage.getItem('studyhub_db') ? JSON.parse(localStorage.getItem('studyhub_db')) : JSON.parse(JSON.stringify(DATABASE));
        let currentUser = JSON.parse(localStorage.getItem('studyhub_currentUser')) || null;

        // Save database to localStorage for persistence
        function saveDatabase() {
            localStorage.setItem('studyhub_db', JSON.stringify(dbData));
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            event.target.classList.add('active');
        }

        function showNotification(msg) {
            const div = document.createElement('div');
            div.className = 'notification';
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            
            if (!email) {
                showNotification('Please enter an email');
                return;
            }

            if (dbData.users[email]) {
                currentUser = dbData.users[email];
                localStorage.setItem('studyhub_currentUser', JSON.stringify(currentUser));
                showNotification('✅ Logged in!');
                showUI();
            } else {
                showNotification('Account not found. Sign up instead!');
            }
        }

        function handleSignup() {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const role = document.getElementById('accountType').value;

            if (!name || !email) {
                showNotification('Please fill all fields');
                return;
            }

            if (dbData.users[email]) {
                showNotification('Email already exists');
                return;
            }

            dbData.users[email] = { name, role, email, created: new Date().toISOString() };
            saveDatabase();

            currentUser = dbData.users[email];
            localStorage.setItem('studyhub_currentUser', JSON.stringify(currentUser));
            showNotification('✅ Account created!');
            showUI();
        }

        function logout() {
            if (confirm('Logout?')) {
                currentUser = null;
                localStorage.removeItem('studyhub_currentUser');
                location.reload();
            }
        }

        function showUI() {
            document.getElementById('accountModal').classList.add('hidden');
            document.getElementById('userName').textContent = currentUser.name;
            document.getElementById('userRole').textContent = currentUser.role === 'teacher' ? '👨‍🏫 Teacher' : '👨‍🎓 Student';

            if (currentUser.role === 'teacher') {
                document.getElementById('teacherSection').style.display = 'block';
                document.getElementById('studentSection').style.display = 'none';
            } else {
                document.getElementById('teacherSection').style.display = 'none';
                document.getElementById('studentSection').style.display = 'block';
            }

            renderAssignments();
            setupNavigation();
        }

        function setupNavigation() {
            document.querySelectorAll('nav button').forEach(btn => {
                btn.onclick = (e) => {
                    const section = e.target.dataset.section;
                    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                    document.getElementById(section).classList.add('active');
                    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                };
            });
        }

        function createAssignment() {
            const title = document.getElementById('assignmentTitle').value.trim();
            const desc = document.getElementById('assignmentDesc').value.trim();
            const due = document.getElementById('assignmentDue').value;
            const points = parseInt(document.getElementById('assignmentPoints').value) || 100;

            if (!title || !desc || !due) {
                showNotification('Please fill all fields');
                return;
            }

            const id = Date.now();
            dbData.assignments.push({
                id, title, desc, due, points,
                teacher: currentUser.email,
                teacherName: currentUser.name,
                created: new Date().toISOString()
            });
            dbData.submissions[id] = [];

            saveDatabase();

            document.getElementById('assignmentTitle').value = '';
            document.getElementById('assignmentDesc').value = '';
            document.getElementById('assignmentDue').value = '';
            renderAssignments();
            showNotification('✅ Assignment posted!');
        }

        function submitAssignment(id) {
            document.getElementById('fileInput').onchange = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                if (!dbData.submissions[id]) dbData.submissions[id] = [];
                dbData.submissions[id].push({
                    student: currentUser.email,
                    studentName: currentUser.name,
                    files: files.map(f => ({name: f.name, size: f.size})),
                    date: new Date().toISOString(),
                    grade: null
                });

                saveDatabase();
                renderAssignments();
                showNotification('✅ Submitted!');
            };
            document.getElementById('fileInput').click();
        }

        function renderAssignments() {
            const assignments = dbData.assignments || [];
            const submissions = dbData.submissions || {};

            if (currentUser.role === 'teacher') {
                const html = assignments
                    .filter(a => a.teacher === currentUser.email)
                    .map(a => `
                        <div class="assignment-card">
                            <div class="assignment-title">${a.title}</div>
                            <div class="assignment-due">Due: ${a.due} | Points: ${a.points}</div>
                            <p>${a.desc}</p>
                            <div style="margin-top: 1rem; font-size: 0.9rem;">
                                <strong>Submissions: ${(submissions[a.id] || []).length}</strong>
                                ${(submissions[a.id] || []).map(s => `
                                    <div style="background:#f0f0f0; padding:1rem; margin-top:0.5rem; border-radius:8px;">
                                        <strong>${s.studentName}</strong> - ${new Date(s.date).toLocaleDateString()}
                                        <div style="font-size:0.85rem; margin-top:0.5rem;">
                                            ${s.files.map(f => `📄 ${f.name}`).join('<br>')}
                                        </div>
                                        ${s.grade ? `<div style="color:var(--primary); font-weight:600; margin-top:0.5rem;">Grade: ${s.grade}/${a.points}</div>` : `
                                            <div style="margin-top:0.5rem; display:flex; gap:0.5rem;">
                                                <input type="number" placeholder="Grade" max="${a.points}" id="grade_${a.id}_${s.student}" style="flex:1; padding:0.5rem;">
                                                <button class="btn btn-small" onclick="gradeSubmission(${a.id}, '${s.student}')">Post</button>
                                            </div>
                                        `}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('');
                document.getElementById('submissionsArea').innerHTML = html || '<p style="color:#888;">No assignments yet</p>';
            } else {
                const html = assignments.map(a => {
                    const sub = (submissions[a.id] || []).find(s => s.student === currentUser.email);
                    return `
                        <div class="assignment-card">
                            <div class="assignment-title">${a.title}</div>
                            <div class="assignment-due">Due: ${a.due}</div>
                            <span class="assignment-status ${sub ? (sub.grade ? 'status-graded' : 'status-submitted') : 'status-pending'}">
                                ${sub ? (sub.grade ? '✓ GRADED' : '✓ SUBMITTED') : 'PENDING'}
                            </span>
                            <p>${a.desc}</p>
                            <div style="font-size:0.9rem; margin:1rem 0;">Points: ${a.points}</div>
                            ${sub && sub.grade ? `<div style="background:rgba(255,230,109,0.2); padding:1rem; border-radius:8px; margin:1rem 0;">Your Grade: <strong>${sub.grade}/${a.points}</strong></div>` : ''}
                            ${!sub ? `
                                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                                    📤 Click to upload files
                                </div>
                                <button class="btn" onclick="submitAssignment(${a.id})" style="margin-top:1rem;">Submit Assignment</button>
                            ` : `
                                <div style="background:#f0f0f0; padding:1rem; border-radius:8px; margin-top:1rem;">
                                    <strong>Submitted:</strong><br>
                                    ${sub.files.map(f => `📄 ${f.name}`).join('<br>')}
                                </div>
                            `}
                        </div>
                    `;
                }).join('');
                document.getElementById('assignmentsArea').innerHTML = html || '<p style="color:#888;">No assignments available</p>';
            }
        }

        function gradeSubmission(id, student) {
            const grade = document.getElementById(`grade_${id}_${student}`).value;
            if (!grade) {
                showNotification('Enter a grade');
                return;
            }
            const sub = dbData.submissions[id].find(s => s.student === student);
            if (sub) {
                sub.grade = grade;
                saveDatabase();
                renderAssignments();
                showNotification('✅ Grade posted!');
            }
        }

        // Initialize
        if (currentUser) {
            showUI();
        }
    </script>
</body>
</html>
